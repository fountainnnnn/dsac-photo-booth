    (() => {
      const $ = (i) => document.getElementById(i);
      const tl = gsap.timeline({ paused: true });
      const E = OH.E;
      const at0 = (els) => tl.set(els, { opacity: 0 }, 0);

      const cur = $("c08-cur");
      tl.set(cur, { opacity: 0 }, 0);
      const mv = (a, b, t, d = 0.45, click = true) => {
        tl.fromTo(cur, { x: a[0], y: a[1] }, { x: b[0], y: b[1], duration: d, ease: E.io, immediateRender: false }, t);

        return t + d;
      };
      const curIn = (t) => tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, t);
      const curOut = (t) => tl.fromTo(cur, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t);

      tl.set([$("c08-hd2"), $("c08-badge")], { opacity: 0 }, 0);
      tl.fromTo([$("c08-stage"), $("c08-rail")], { x: -120 }, { x: 0, duration: 0.7, ease: E.back }, 0.0);
      OH.bounce(tl, $("c08-hd"), 0.2, { stagger: 0.035 });
      // Passers-by stroll across behind the group (far back, smaller).
      const walk = (id, x0, x1, t, d) => tl.fromTo($(id), { x: x0, y: 0 }, { x: x1, y: 0, duration: d, ease: "none", immediateRender: false }, t);

      // 2.10 — People: 3. The two at the back are cut away (they shrink into the background); a badge pops.
      curIn(1.2); mv([1900, 1100], [1727, 613], 1.2, 0.55);
      tl.fromTo($("c08-on3"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: E.pop, immediateRender: false }, 1.75);
      tl.fromTo($("c08-pass"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.85, duration: 0.35, ease: E.in, transformOrigin: "960px 400px", immediateRender: false }, 2.0);
      OH.pop(tl, $("c08-badge"), 2.2, { rot: -5 });
      curOut(2.6);
      // 3.60 — the rule, then a passer-by walks through again, only a dashed ghost: not in the photo.
      OH.flyOut(tl, $("c08-hd"), 3.5);
      tl.set($("c08-hd2"), { opacity: 1 }, 3.8);
      OH.bounce(tl, $("c08-hd2"), 3.8, { stagger: 0.025 });

      tl.fromTo($("c08-crew"), { scaleX: 0.94 }, { scaleX: 1, duration: 0.5, ease: E.pop, transformOrigin: "960px 1080px", immediateRender: false }, 6.65);
      tl.fromTo($("c08-world"), { scale: 1 }, { scale: 1.04, duration: 10, ease: "none", immediateRender: false }, 0);

      tl.set({}, {}, 10.0);
      window.__timelines["c08"] = tl;
