    [data-composition-id="c04"] .hd { position: absolute; left: 110px; top: 92px; font-size: 112px; line-height: 120px; font-weight: 900; letter-spacing: -0.045em; color: #1b1a1f; white-space: nowrap; }

  <div id="c04-root" class="oh" data-composition-id="c04" data-width="1920" data-height="1080" data-duration="8.0">
    <div id="c04-ground" class="oh-ground clip" data-start="0" data-duration="8.0" data-track-index="0" style="background:#59b6ff"></div>
    <div id="c04-world" class="oh-world">

      <div id="c04-hd" class="hd">Pick a place.</div>
      <div id="c04-stage" class="stage"><div class="cam"><div class="art"><div id="c04-b0" class="lay"><img class="full" src="assets/oh/backgrounds/studio.svg" alt=""></div><div id="c04-b1" class="lay" style="opacity:0"><img class="full" src="assets/oh/backgrounds/sunset.svg" alt=""></div><div id="c04-b2" class="lay" style="opacity:0"><img class="full" src="assets/oh/backgrounds/space.svg" alt=""></div><div id="c04-b3" class="lay" style="opacity:0"><img class="full" src="assets/oh/backgrounds/neon.svg" alt=""></div><div id="c04-crew" class="lay"><img class="full" src="assets/v2/crew.svg" alt=""></div></div></div><img class="frm" src="assets/oh/frame-doodle.png" alt=""></div>
      <div id="c04-rail" class="rail">
        <p class="r-label" style="top:36px">Background</p>
        <div class="r-input" style="top:92px"><span class="ph">Where do you want to be?</span></div>
        <div class="r-btn" style="top:196px;opacity:0.4"><span>Make it</span></div>
        <p class="r-note" style="top:300px">What you type is sent to<br>an online image service.</p>
        <div id="c04-t-studio" class="bt" style="left:40px;top:400px"><img src="assets/oh/backgrounds/studio.svg" alt=""><span>Studio</span><i id="c04-r-studio" class="ring"></i></div><div id="c04-t-sunset" class="bt" style="left:250px;top:400px"><img src="assets/oh/backgrounds/sunset.svg" alt=""><span>Sunset</span><i id="c04-r-sunset" class="ring" style="opacity:0"></i></div><div id="c04-t-space" class="bt" style="left:40px;top:560px"><img src="assets/oh/backgrounds/space.svg" alt=""><span>Space</span><i id="c04-r-space" class="ring" style="opacity:0"></i></div><div id="c04-t-neon" class="bt" style="left:250px;top:560px"><img src="assets/oh/backgrounds/neon.svg" alt=""><span>Neon</span><i id="c04-r-neon" class="ring" style="opacity:0"></i></div>

      <div id="c04-hd2" class="hd2">Four, ready to go.</div>
      <svg id="c04-cur" class="cur" viewBox="0 0 32 44"><path d="M3 2 28 24 17 25 23 40 17 43 11 27 3 34Z" fill="#fff" stroke="#1b1a1f" stroke-width="2.6" stroke-linejoin="round"/></svg>

    </div>
  </div>
  <script>
    (() => {
      const $ = (i) => document.getElementById(i);
      const tl = gsap.timeline({ paused: true });
      const E = OH.E;
      const at0 = (els) => tl.set(els, { opacity: 0 }, 0);

      const cur = $("c04-cur");
      tl.set(cur, { opacity: 0 }, 0);
      const mv = (a, b, t, d = 0.45, click = true) => {
        tl.fromTo(cur, { x: a[0], y: a[1] }, { x: b[0], y: b[1], duration: d, ease: E.io, immediateRender: false }, t);
        if (click) { tl.fromTo(cur, { scale: 1 }, { scale: 0.78, duration: 0.07, ease: E.in, immediateRender: false }, t + d);
          tl.fromTo(cur, { scale: 0.78 }, { scale: 1, duration: 0.3, ease: E.back, immediateRender: false }, t + d + 0.08); }
        return t + d;
      };
      const curIn = (t) => tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, t);
      const curOut = (t) => tl.fromTo(cur, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t);

      // 0.05 — the booth screen is thrown up into frame and the rail slides in after it (speed-ramped: fast, then a
      // long soft landing, a little tilt left over).
      tl.fromTo($("c04-stage"), { y: 900, rotation: -10 }, { y: 0, rotation: -1.5, duration: 0.9, ease: E.out }, 0.05);
      tl.fromTo($("c04-rail"), { x: 760, rotation: 12 }, { x: 0, rotation: 1.5, duration: 0.9, ease: E.out }, 0.25);
      OH.bounce(tl, $("c04-hd"), 0.45, { stagger: 0.04 });
      tl.set($("c04-bub"), { opacity: 0 }, 0);
      // Clicks: Sunset 2.0 · Space 3.2 · Neon 4.4. Each new place deals in from the right like a card
      // (crawl, whip, settle), the guests hop, the name pops in a speech bubble.
      const T = { studio: (1465, 717), sunset: (1675, 717), space: (1465, 877), neon: (1675, 877) };
      curIn(1.45);
      mv([1900, 1120], T.sunset, 1.45, 0.55);
      mv(T.sunset, T.space, 2.75, 0.45);
      mv(T.space, T.neon, 3.95, 0.45);
      tl.fromTo(cur, { x: T.neon[0], y: T.neon[1] }, { x: 1900, y: 1150, duration: 0.6, ease: E.in, immediateRender: false }, 5.0);
      const seq = [["sunset", "b1", 2.0, "nb1"], ["space", "b2", 3.2, "nb2"], ["neon", "b3", 4.4, "nb3"]];
      let prev = "studio", prevB = "b0";
      seq.forEach(([tid, bid, t, label]) => {
        tl.fromTo($("c04-r-" + prev), { opacity: 1 }, { opacity: 0, duration: 0.08, immediateRender: false }, t);
        tl.fromTo($("c04-r-" + tid), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: E.pop, immediateRender: false }, t);
        tl.set($("c04-" + bid), { opacity: 1 }, t + 0.02);
        tl.fromTo($("c04-" + bid), { x: 1920, rotation: 6 }, { x: 0, rotation: 0, duration: 0.5, ease: E.whip, immediateRender: false }, t + 0.02);
        tl.fromTo($("c04-" + prevB), { x: 0, scale: 1 }, { x: -700, scale: 0.9, duration: 0.5, ease: E.whip, immediateRender: false }, t + 0.02);
        tl.fromTo($("c04-crew"), { y: 0 }, { y: -70, duration: 0.18, ease: E.out, immediateRender: false }, t + 0.3);
        tl.fromTo($("c04-crew"), { y: -70 }, { y: 0, duration: 0.3, ease: E.drop, immediateRender: false }, t + 0.48);
        tl.set($("c04-" + label), { opacity: 1 }, t + 0.25); tl.set($("c04-" + label), { opacity: 0 }, t + 1.2);
        tl.fromTo($("c04-bub"), { opacity: 0, scale: 0.2, rotation: -16 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.45, ease: E.pop, immediateRender: false }, t + 0.25);
        tl.fromTo($("c04-bub"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.18, ease: E.in, immediateRender: false }, t + 0.98);
        prev = tid; prevB = bid;
      });
      // 5.60 — the headline swaps: its letters fly off, the next line bounces up in the same place.
      OH.flyOut(tl, $("c04-hd"), 5.6);
      OH.bounce(tl, $("c04-hd2"), 5.95, { stagger: 0.035 });
      tl.fromTo($("c04-world"), { scale: 1 }, { scale: 1.05, duration: 8, ease: "none", immediateRender: false }, 0);

      tl.set({}, {}, 8.0);
      window.__timelines["c04"] = tl;
    })();
  </script>
