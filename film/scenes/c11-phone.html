  <script>
    (() => {
      const $ = (i) => document.getElementById(i);
      const tl = gsap.timeline({ paused: true });
      const E = OH.E;
      const at0 = (els) => tl.set(els, { opacity: 0 }, 0);

      tl.set([$("c11-h1"), $("c11-h2"), $("c11-s1"), $("c11-s2")], { opacity: 0 }, 0);
      // 0.00 — continuing c10's rush: the frame is the phone's white page, which shrinks back into a phone.
      tl.fromTo($("c11-cover"), { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, 0.0);
      tl.fromTo($("c11-phone"), { scale: 5.6, x: 0 }, { scale: 1, x: 0, duration: 1.0, ease: E.out }, 0.0);
      // 1.00 — the phone slides left to make room for the words (speed-ramped glide).
      tl.fromTo($("c11-phone"), { x: 0, rotation: 0 }, { x: -420, rotation: -3, duration: 0.7, ease: E.whip, immediateRender: false }, 1.0);
      tl.set($("c11-h1"), { opacity: 1 }, 1.55); OH.bounce(tl, $("c11-h1"), 1.55, { stagger: 0.05 });
      tl.fromTo($("c11-s1"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: E.back, immediateRender: false }, 1.95);
      // 2.30 — tap Save photo (phone moved −420: button centre ≈ (300 + 16 + 224, 30 + 16 + 760)).
      const F = $("c11-fg"), R = $("c11-rp");
      OH.tap(tl, F, R, [760, 1000], [540, 806], 2.3, { travel: 0.35 });
      tl.fromTo($("c11-save"), { scale: 1 }, { scale: 0.94, duration: 0.07, ease: E.in, immediateRender: false }, 2.65);
      tl.fromTo($("c11-save"), { scale: 0.94 }, { scale: 1, duration: 0.35, ease: E.pop, immediateRender: false }, 2.72);
      // 3.80 — the words swap: no app, no account, just the photo.
      OH.flyOut(tl, $("c11-h1"), 3.8);
      tl.fromTo($("c11-s1"), { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 3.8);
      tl.set($("c11-h2"), { opacity: 1 }, 4.15); OH.bounce(tl, $("c11-h2"), 4.15, { stagger: 0.05 });
      tl.fromTo($("c11-s2"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: E.back, immediateRender: false }, 4.6);
      OH.wobble(tl, $("c11-phone"), 4.8, 2.2, 3);
      tl.fromTo($("c11-world"), { scale: 1 }, { scale: 1.04, duration: 7, ease: "none", immediateRender: false }, 0);

      tl.set({}, {}, 7.0);
      window.__timelines["c11"] = tl;
    })();
