  <script>
    (() => {
      const $ = (i) => document.getElementById(i);
      const tl = gsap.timeline({ paused: true });
      const E = OH.E;
      const at0 = (els) => tl.set(els, { opacity: 0 }, 0);

      const cur = $("c06-cur");
      tl.set(cur, { opacity: 0 }, 0);
      const mv = (a, b, t, d = 0.45, click = true) => {
        tl.fromTo(cur, { x: a[0], y: a[1] }, { x: b[0], y: b[1], duration: d, ease: E.io, immediateRender: false }, t);
        if (click) { tl.fromTo(cur, { scale: 1 }, { scale: 0.78, duration: 0.07, ease: E.in, immediateRender: false }, t + d);
          tl.fromTo(cur, { scale: 0.78 }, { scale: 1, duration: 0.3, ease: E.back, immediateRender: false }, t + d + 0.08); }
        return t + d;
      };
      const curIn = (t) => tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, t);
      const curOut = (t) => tl.fromTo(cur, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t);

      const C = {"none": [1430, 754], "shades": [1570, 754], "party": [1710, 754], "cat": [1430, 894], "crown": [1570, 894], "mous": [1710, 894]};
      const A = (k) => ["N", "R", "M"].map((f) => $("c06-" + k + "-" + f));
      ["crown", "party", "shades", "mous"].forEach((k) => tl.set(A(k), { opacity: 0 }, 0));
      tl.set([$("c06-hd2"), $("c06-tg1"), $("c06-tg2"), $("c06-tg3")], { opacity: 0 }, 0);
      tl.fromTo([$("c06-stage"), $("c06-rail")], { scale: 0.92 }, { scale: 1, duration: 0.6, ease: E.back }, 0.0);
      OH.bounce(tl, $("c06-hd"), 0.2, { stagger: 0.035 });
      const pick = (from, k, t) => {
        mv(from, C[k], t - 0.45, 0.45);
        tl.fromTo($("c06g-r-" + k), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: E.pop, immediateRender: false }, t);
      };
      curIn(0.9);
      // 1.40 — Crown: a crown drops onto every head, squashes, settles (head).
      tl.fromTo($("c06g-r-none"), { opacity: 1 }, { opacity: 0, duration: 0.08, immediateRender: false }, 1.4);
      mv([1900, 1100], C.crown, 0.9, 0.5);
      tl.fromTo($("c06g-r-crown"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: E.pop, immediateRender: false }, 1.4);
      A("crown").forEach((el, i) => {
        const t = 1.45 + i * 0.08;
        tl.fromTo(el, { opacity: 0, y: -600, rotation: (i - 1) * 25 }, { opacity: 1, y: 0, rotation: 0, duration: 0.42, ease: E.drop, immediateRender: false }, t);
        tl.fromTo(el, { scaleX: 1, scaleY: 1 }, { scaleX: 1.25, scaleY: 0.75, duration: 0.07, ease: E.out, immediateRender: false }, t + 0.42);
        tl.fromTo(el, { scaleX: 1.25, scaleY: 0.75 }, { scaleX: 1, scaleY: 1, duration: 0.45, ease: E.pop, immediateRender: false }, t + 0.49);
      });
      OH.pop(tl, $("c06-tg1"), 1.9, { rot: -10 });
      // 3.00 — Shades: they fly in from the side and snap onto every pair of eyes (eyes).
      pick(C.crown, "shades", 3.0);
      A("shades").forEach((el, i) => {
        const t = 3.05 + i * 0.07;
        tl.fromTo(el, { opacity: 0, x: -1500, rotation: -40 }, { opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: E.whip, immediateRender: false }, t);
        tl.fromTo(el, { scaleX: 1 }, { scaleX: 0.82, duration: 0.06, ease: E.out, immediateRender: false }, t + 0.5);
        tl.fromTo(el, { scaleX: 0.82 }, { scaleX: 1, duration: 0.4, ease: E.pop, immediateRender: false }, t + 0.56);
      });
      OH.pop(tl, $("c06-tg2"), 3.5, { rot: 8 });
      // 4.50 — Moustache: boing (upper lip).
      pick(C.shades, "mous", 4.5);
      OH.pop(tl, A("mous"), 4.55, { stagger: 0.07, rot: -30, dur: 0.55 });
      OH.pop(tl, $("c06-tg3"), 5.0, { rot: -6 });
      // 6.00 — new heading; Party hat replaces the crown (one avatar per part): crowns spin off, hats drop in.
      OH.unpop(tl, [$("c06-tg1"), $("c06-tg2"), $("c06-tg3")], 5.8);
      OH.flyOut(tl, $("c06-hd"), 6.0);
      tl.set($("c06-hd2"), { opacity: 1 }, 6.3);
      OH.bounce(tl, $("c06-hd2"), 6.3, { stagger: 0.035 });
      pick(C.mous, "party", 6.9);
      tl.fromTo($("c06g-r-crown"), { opacity: 1 }, { opacity: 0, duration: 0.08, immediateRender: false }, 6.9);
      A("crown").forEach((el, i) => tl.fromTo(el, { y: 0, rotation: 0, opacity: 1 }, { y: -700, rotation: (i - 1) * 120 + 90, opacity: 0, duration: 0.5, ease: E.in, immediateRender: false }, 6.95 + i * 0.05));
      A("party").forEach((el, i) => {
        const t = 7.15 + i * 0.08;
        tl.fromTo(el, { opacity: 0, y: -600 }, { opacity: 1, y: 0, duration: 0.4, ease: E.drop, immediateRender: false }, t);
        tl.fromTo(el, { scaleX: 1, scaleY: 1 }, { scaleX: 1.2, scaleY: 0.8, duration: 0.07, ease: E.out, immediateRender: false }, t + 0.4);
        tl.fromTo(el, { scaleX: 1.2, scaleY: 0.8 }, { scaleX: 1, scaleY: 1, duration: 0.45, ease: E.pop, immediateRender: false }, t + 0.47);
      });
      tl.fromTo(cur, { x: C.party[0], y: C.party[1] }, { x: 1900, y: 1150, duration: 0.6, ease: E.in, immediateRender: false }, 8.2);
      // 8.60 — the three of them cheer: two hops.
      [8.6, 9.4].forEach((t) => {
        tl.fromTo($("c06-crew"), { y: 0 }, { y: -60, duration: 0.18, ease: E.out, immediateRender: false }, t);
        tl.fromTo($("c06-crew"), { y: -60 }, { y: 0, duration: 0.28, ease: E.drop, immediateRender: false }, t + 0.18);
      });
      tl.fromTo($("c06-world"), { scale: 1 }, { scale: 1.04, duration: 11, ease: "none", immediateRender: false }, 0);

      tl.set({}, {}, 11.0);
      window.__timelines["c06"] = tl;
    })();
