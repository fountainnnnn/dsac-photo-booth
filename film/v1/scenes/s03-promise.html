<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<template>
  <style>
    /* The promise, then its second half in the same slot. s04 opens through the full stop of "anywhere." (iris). One line, centred on (960,540): 128px on a 133px line box, top 473. */
    [data-composition-id="s03"] .s03-line { position: absolute; left: 0; top: 473px; width: 1920px; font-size: 128px; line-height: 133px; white-space: nowrap; }
  </style>
  <div id="s03-root" class="rk-scene" data-composition-id="s03" data-width="1920" data-height="1080" data-duration="3.5" data-qa-center="x">
    <div id="s03-ground" class="rk-ground clip" data-start="0" data-duration="3.5" data-track-index="0"></div>
    <div id="s03-world" class="rk-world" data-qa-camera>
      <div id="s03-a" class="s03-line t-hero">Step in.</div>
      <div id="s03-b" class="s03-line t-hero">Go anywhere.</div>
    </div>
  </div>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      tl.set($("s03-b"), { opacity: 0 }, 0);
      // 0.00 — "Step in." builds; 1.30 it gives way to "Go anywhere." in the same slot.
      RK.words(tl, $("s03-a"), 0.0, { stagger: 0.07 });
      RK.swap(tl, $("s03-a"), $("s03-b"), 1.3, { words: true, stagger: 0.07 });
      // No drift: the next scene opens through the full stop, so the line holds perfectly still.
      window.__timelines["s03"] = tl;
    })();
  </script>
</template>
</body>
</html>
