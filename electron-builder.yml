# Packaging for the booth laptop.
#
# The target machine has nothing installed — no Node, no npm, no terminal — so
# everything ships inside the artefact: Electron's own Node 24 (which is where
# node:sqlite comes from), the built frontend, the Express server, and
# cloudflared for the public URL.
#
#   npm run package   ->  release/
#
# Two artefacts come out, because "send someone an exe" can mean either thing:
#   DSAC Photo Booth <version>.exe          installer, adds a desktop shortcut
#   DSAC Photo Booth <version> portable.exe single file, runs from anywhere

appId: sg.edu.sp.dsac.photobooth
productName: DSAC Photo Booth
copyright: Singapore Polytechnic Data Science & Analytics Centre

directories:
  output: release
  buildResources: build

files:
  - dist/**            # the built frontend, served by Express
  - server/**
  - electron/**
  - package.json
  # Frontend libraries are production dependencies because Vite needs them at
  # build time, but their output is already inside dist/. Nothing at runtime
  # resolves them, and together they are 54 MB of dead weight in the download.
  - "!node_modules/@phosphor-icons/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/cloudflared/bin/**"   # wrong platform; see extraResources

# cloudflared is a real executable and has to be spawned, which means it must
# live on the actual filesystem rather than inside the asar archive.
#
# It is also the Windows build, fetched by `scripts/fetch-cloudflared-win.mjs`
# rather than taken from node_modules: the npm package downloads a binary for
# whatever machine ran `npm install`, so packaging on a Mac would otherwise
# ship a Mach-O file the booth laptop cannot run.
extraResources:
  - from: build/cloudflared.exe
    to: cloudflared.exe

# Where the installed app looks for new versions. The repository is public, so
# the booth needs no token to read its releases.
#
# Only the nsis build can update itself — electron-updater cannot patch a
# portable .exe, which has no install location to write back to. The portable
# artefact is still built, for a USB stick, but whoever runs it replaces it by
# hand.
publish:
  provider: github
  owner: fountainnnnn
  repo: dsac-photo-booth

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # A booth is set up by whoever is running the event, not by IT. One click,
  # no install location prompt, shortcuts where they expect them.
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # No version in the filename. The laptop keeps one file, at one name, and
  # the desktop shortcut and install path stay put across every update — which
  # is also what lets someone re-download over the old copy without ending up
  # with four numbered installers in Downloads.
  # Hyphens, not spaces: GitHub rewrites spaces in an uploaded asset's name,
  # and the updater looks for the name latest.yml recorded. A file uploaded by
  # hand as "DSAC Photo Booth Setup.exe" arrives as "DSAC.Photo.Booth.Setup.exe"
  # and every booth's update check 404s against a release that looks complete.
  artifactName: DSAC-Photo-Booth-Setup.${ext}

portable:
  artifactName: DSAC-Photo-Booth-portable.${ext}
  # Photos and settings live in the user's AppData either way, so a portable
  # run keeps its database across launches instead of starting empty.
  requestExecutionLevel: user
