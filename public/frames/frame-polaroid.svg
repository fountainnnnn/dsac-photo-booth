<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="none" fill="none">
  <defs>
    <filter id="polaroid-lip" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0a0a0b" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Instant-film border: an even 34px on three sides with a deeper 118px
       bottom margin for the lockup. fill-rule="evenodd" punches the photo
       window out so the centre stays fully transparent. -->
  <path
    d="M0 0H1600V900H0V0ZM34 34V782H1566V34H34Z"
    fill="#ffffff"
    fill-rule="evenodd"
    filter="url(#polaroid-lip)"/>

  <!-- Hairline so the white border never bleeds into a bright photo -->
  <rect x="35" y="35" width="1530" height="746" fill="none" stroke="#0a0a0b" stroke-opacity=".12" stroke-width="2"/>

  <!-- ── Bottom margin ── -->
  <rect x="34" y="815" width="5" height="54" fill="#e1262f"/>
  <text x="60" y="861" font-family="'Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#e1262f">SP</text>

  <text x="1566" y="852" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="2.2" fill="#17161a">AI LEARNING JOURNEY</text>
  <text x="1566" y="881" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" letter-spacing=".2" fill="#6b6971">Singapore Polytechnic &#183; Data Science &amp; Analytics Centre</text>
</svg>
