  <text x="118" y="884" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.50)" letter-spacing="0.3">Singapore Polytechnic · Data Science &amp; Analytics Centre</text>

  <!-- Bottom-left corner bracket (above bar) -->
